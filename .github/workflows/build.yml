
name: Build Dub Chamber for macOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure plugin
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin
        run: cmake --build build --config Release --parallel 3

      
      - name: Package plugins
        run: |
          mkdir -p package
          find build -type d \( -name '*.vst3' -o -name '*.component' \) -prune -print
          while IFS= read -r plugin; do
            name=$(basename "$plugin")
            ditto -c -k --sequesterRsrc --keepParent "$plugin" "package/${name}.zip"
          done < <(find build -type d \( -name '*.vst3' -o -name '*.component' \) -prune)
          ls -lah package


      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Dub-Chamber-macOS-plugins
          path: package/*
          if-no-files-found: error
          retention-days: 14

